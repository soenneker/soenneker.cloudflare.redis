name: build-and-test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: build-and-test-${{ github.event_name == 'release' && 'publish-images' || github.run_id }}
  queue: max
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node --test test/image-update.test.js
      - run: npx --no-install wrangler deploy --dry-run
      - run: dotnet build relay/RedisRelay.cs -c Release
      - run: python3 test/cache.py
      - name: Publish tested image to Docker Hub
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN Actions secret}"
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$RELEASE_TAG" == latest ]]; then
            echo "::error::Use a Docker-compatible release tag such as v1.2.3."
            exit 1
          fi

          tested_image=soenneker-cloudflare-redis:cache-verify
          hub_repo=docker.io/soenneker/cloudflare-redis

          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username soenneker --password-stdin
          docker tag "$tested_image" "$hub_repo:$RELEASE_TAG"
          docker push "$hub_repo:$RELEASE_TAG"
          digest=$(docker buildx imagetools inspect "$hub_repo:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Docker Hub image: \`$hub_repo@$digest\` (tag \`$RELEASE_TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PRERELEASE" == false ]]; then
            latest_tag=$(gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -F name="${GITHUB_REPOSITORY#*/}" \
              -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { latestRelease { tagName } } }' \
              --jq '.data.repository.latestRelease.tagName // ""')
            if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
              docker tag "$tested_image" "$hub_repo:latest"
              docker push "$hub_repo:latest"
            fi
          fi
