name: build-and-test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node --test test/image-update.test.js
      - run: npx --no-install wrangler deploy --dry-run
      - run: python3 test/persistence.py
